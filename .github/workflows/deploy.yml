name: Deploy Automático Kanade

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            cd /var/www/Kenade
            git pull origin main

            # Compila o binário atualizado
            /usr/local/go/bin/go build -o kenade-app main.go

            # Reinicia o serviço
            systemctl restart kenade.service